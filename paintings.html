<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paintings — Samira Samadi</title>
<meta name="description" content="Abstract paintings by Samira Samadi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --ink:#181b22;
    --muted:#5b5e56;
    --muted-2:#8a8d82;
    --border:#dddbcf;
    --accent:#1f6f63;
    --accent-ink:#0f3e37;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  ::selection{ background:var(--accent); color:var(--surface); }
  a{ color:var(--accent-ink); text-decoration-color:var(--border); text-underline-offset:3px; }
  a:hover{ text-decoration-color:currentColor; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .page{
    max-width:1160px;
    margin:0 auto;
    padding:56px 24px 96px;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13.5px;
    color:var(--muted);
    text-decoration:none;
    margin-bottom:36px;
  }
  .back-link:hover{ color:var(--accent-ink); }
  .back-link svg{ width:14px; height:14px; }

  h1{
    font-family:"Newsreader", Georgia, serif;
    font-weight:500;
    font-size:clamp(30px,5vw,40px);
    line-height:1.15;
    margin:0 0 36px;
  }
  .intro-line{
    font-size:14.5px;
    color:var(--muted);
    max-width:56ch;
    margin:0 0 40px;
  }

  .stream{
    position:relative;
  }

  .stream figure{
    position:absolute;
    margin:0;
    opacity:0;
    transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease, left .3s ease, top .3s ease, width .3s ease;
  }
  .stream figure.in-view{
    opacity:1;
    transform:translateY(0);
  }
  .stream img{
    display:block;
    width:100%;
    height:auto;
    border-radius:5px;
    cursor:zoom-in;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }
  .stream img:hover{
    transform:scale(1.015) translateY(-2px);
    box-shadow:0 18px 32px -14px rgba(0,0,0,0.35);
  }

  footer{
    margin-top:56px;
    padding-top:20px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--muted-2);
    font-family:"IBM Plex Mono", ui-monospace, monospace;
  }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:32px;
  }
  .lightbox[hidden]{ display:none; }
  .lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:3px;
  }
  .lightbox-btn{
    position:absolute;
    background:none;
    border:none;
    color:#f1f0ea;
    font-size:28px;
    line-height:1;
    cursor:pointer;
    padding:12px;
  }
  .lightbox-close{ top:8px; right:8px; }
  .lightbox-prev{ left:0; top:50%; transform:translateY(-50%); }
  .lightbox-next{ right:0; top:50%; transform:translateY(-50%); }
  .lightbox-btn:hover{ color:var(--accent); }
</style>
</head>
<body>
<div class="page">

  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Samira Samadi
  </a>

  <h1>Paintings</h1>

  <div class="stream" id="stream">
    <figure data-row="1" data-group="0" data-idx="0"><img src="01-alt-1.jpg" alt="Painting held against a tiled wall"></figure>
    <figure data-row="1" data-group="1" data-idx="0"><img src="02-hero.jpg" alt="Abstract painting in pink and orange pointillist squares"></figure>
    <figure data-row="1" data-group="2" data-idx="0"><img src="03-hero.jpg" alt="Abstract painting with red, black and a floral motif"></figure>
    <figure class="featured" data-group="4" data-idx="0"><img src="05-hero.jpg" alt="Abstract painting in blue, purple and brown, fluid forms"></figure>
    <figure data-group="1" data-idx="1"><img src="02-detail-1.jpg" alt="Detail of the pink and orange painting"></figure>
    <figure data-group="3" data-idx="0"><img src="04-hero.jpg" alt="Abstract painting of a city skyline against a navy field"></figure>
    <figure data-group="2" data-idx="1"><img src="03-detail-1.jpg" alt="Detail of the floral motif"></figure>
    <figure data-group="4" data-idx="1"><img src="05-detail-1.jpg" alt="Detail of the blue and brown painting"></figure>
    <figure data-group="0" data-idx="2"><img src="01-alt-2.jpg" alt="Painting framed and displayed on a console table"></figure>
    <figure data-group="1" data-idx="2"><img src="02-alt-1.jpg" alt="Painting displayed on an easel with a plant"></figure>
    <figure data-group="4" data-idx="2"><img src="05-alt-1.jpg" alt="Painting displayed on a credenza with a lamp"></figure>
    <figure data-group="2" data-idx="2"><img src="03-alt-1.jpg" alt="Painting displayed on a console table"></figure>
    <figure data-group="3" data-idx="1"><img src="04-alt-1.jpg" alt="Painting displayed on a table with candlesticks"></figure>
    <figure data-group="1" data-idx="3"><img src="02-detail-2.jpg" alt="Detail of the pink and orange painting, textured squares"></figure>
    <figure data-group="4" data-idx="3"><img src="05-detail-2.jpg" alt="Detail of the blue and brown painting, flowing forms"></figure>
    <figure data-group="0" data-idx="1"><img src="01-hero.jpg" alt="Abstract painting in blue, teal, gold and pink"></figure>
  </div>

  <footer>samirasamadi.org</footer>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-btn lightbox-close" id="lb-close" aria-label="Close">&times;</button>
  <button class="lightbox-btn lightbox-prev" id="lb-prev" aria-label="Previous image">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button class="lightbox-btn lightbox-next" id="lb-next" aria-label="Next image">&#8250;</button>
</div>

<script>
  var stream = document.getElementById('stream');
  var GAP = 14;

  var figKeyMap = new WeakMap();
  var figKeyCounter = 0;
  function figKey(fig){
    if(!figKeyMap.has(fig)) figKeyMap.set(fig, 'f' + (figKeyCounter++));
    return figKeyMap.get(fig);
  }

  function colCount(){
    var w = window.innerWidth;
    if(w <= 560) return 1;
    if(w <= 900) return 2;
    return 3;
  }

  function layout(){
    var containerWidth = stream.clientWidth;
    var cols = colCount();
    var colWidth = (containerWidth - GAP * (cols - 1)) / cols;
    var colHeights = new Array(cols).fill(0);
    var figures = Array.from(stream.querySelectorAll('figure'));

    // reset any row-alignment overrides from a previous layout pass
    figures.forEach(function(fig){
      var img = fig.querySelector('img');
      img.style.height = '';
      img.style.objectFit = '';
      fig.style.height = '';
    });

    var handled = {};

    if(cols === 3){
      var rowGroups = {};
      figures.forEach(function(fig){
        var r = fig.dataset.row;
        if(!r) return;
        rowGroups[r] = rowGroups[r] || [];
        rowGroups[r].push(fig);
      });
      Object.keys(rowGroups).forEach(function(r){
        var members = rowGroups[r];
        if(members.length !== cols) return;
        var top = Math.max.apply(null, colHeights);
        var heights = members.map(function(fig){
          var img = fig.querySelector('img');
          var ratio = (img.naturalWidth && img.naturalHeight) ? (img.naturalHeight / img.naturalWidth) : 0.75;
          return colWidth * ratio;
        });
        var rowHeight = Math.min.apply(null, heights);
        members.forEach(function(fig, i){
          var img = fig.querySelector('img');
          fig.style.left = (i * (colWidth + GAP)) + 'px';
          fig.style.top = top + 'px';
          fig.style.width = colWidth + 'px';
          fig.style.height = rowHeight + 'px';
          img.style.height = '100%';
          img.style.objectFit = 'cover';
          handled[figKey(fig)] = true;
          colHeights[i] = top + rowHeight + GAP;
        });
      });
    }

    figures.forEach(function(fig){
      if(handled[figKey(fig)]) return;
      var img = fig.querySelector('img');
      var ratio = (img.naturalWidth && img.naturalHeight) ? (img.naturalHeight / img.naturalWidth) : 0.75;
      var full = fig.classList.contains('featured') || cols === 1;

      if(full){
        var top = Math.max.apply(null, colHeights);
        var h = Math.min(containerWidth * ratio, window.innerHeight * 0.78);
        fig.style.left = '0px';
        fig.style.top = top + 'px';
        fig.style.width = containerWidth + 'px';
        var newHeight = top + h + GAP;
        for(var i = 0; i < cols; i++) colHeights[i] = newHeight;
      } else {
        var minCol = colHeights.indexOf(Math.min.apply(null, colHeights));
        var left = minCol * (colWidth + GAP);
        var top2 = colHeights[minCol];
        var h2 = colWidth * ratio;
        fig.style.left = left + 'px';
        fig.style.top = top2 + 'px';
        fig.style.width = colWidth + 'px';
        colHeights[minCol] = top2 + h2 + GAP;
      }
    });

    stream.style.height = Math.max.apply(null, colHeights.concat([0])) + 'px';
  }

  var layoutScheduled = false;
  function scheduleLayout(){
    if(layoutScheduled) return;
    layoutScheduled = true;
    requestAnimationFrame(function(){
      layoutScheduled = false;
      layout();
    });
  }

  document.querySelectorAll('.stream img').forEach(function(img){
    if(img.complete && img.naturalWidth){
      scheduleLayout();
    } else {
      img.addEventListener('load', scheduleLayout);
    }
  });
  window.addEventListener('resize', scheduleLayout);
  window.addEventListener('load', scheduleLayout);
  scheduleLayout();

  var groups = {};
  document.querySelectorAll('.stream figure').forEach(function(fig){
    var g = fig.dataset.group;
    groups[g] = groups[g] || [];
    var img = fig.querySelector('img');
    groups[g].push({ src: img.src, alt: img.alt, fig: fig });
  });

  var currentGroup = null, currentIdx = 0;
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');

  function openLightbox(g, i){
    currentGroup = g; currentIdx = i;
    render();
    lb.hidden = false;
  }
  function render(){
    var item = groups[currentGroup][currentIdx];
    lbImg.src = item.src;
    lbImg.alt = item.alt;
  }
  function closeLightbox(){ lb.hidden = true; }
  function step(delta){
    var len = groups[currentGroup].length;
    currentIdx = (currentIdx + delta + len) % len;
    render();
  }

  document.querySelectorAll('.stream figure').forEach(function(fig){
    fig.querySelector('img').addEventListener('click', function(){
      openLightbox(fig.dataset.group, Number(fig.dataset.idx));
    });
  });

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('lb-next').addEventListener('click', function(){ step(1); });
  lb.addEventListener('click', function(e){ if(e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', function(e){
    if(lb.hidden) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') step(-1);
    if(e.key === 'ArrowRight') step(1);
  });

  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold:0.1, rootMargin:"0px 0px -40px 0px" });
  document.querySelectorAll('.stream figure').forEach(function(fig){ observer.observe(fig); });
</script>
</body>
</html>
